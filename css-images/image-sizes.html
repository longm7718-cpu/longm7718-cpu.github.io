<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Controlling Sizes of Images in CSS</title>
    <style>
        img.large {
            width:500px;
            height: 500px;
        }
        img.medium {
            width: 250px;
            height: 250px;
        }
        img.small {
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>Image Sizes</h1>
    <img src="../_img/magnolia-large.jpg" class="large" alt="Magnolia" />
    <img src="../_img/magnolia-medium.jpg" class="medium" alt="Magnolia" />
    <img src="../_img/magnolia-small.jpg" class="small" alt="Magnolia" />
</body>
<footer>

    <a href="index.html">Go Back</a>
</footer>
</html>
