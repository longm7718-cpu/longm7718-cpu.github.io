<!DOCTYPE html>
<html>
  <head>
    <title>CSS3: Box Shadows</title>
    <style type="text/css">
      p {
	width: 100px;
	height: 100px;
	background-color: #e1ddda;
	margin: 20px;
	display: inline-block; } 
      p.one {
	box-shadow: -5px -5px #777777; }
      p.two {
	box-shadow: 5px 5px 5px #777777; }
      p.three {
	box-shadow: 5px 5px 5px 5px #777777; }
      p.four {
	box-shadow: 0 0 10px #777777; }
      p.five {
	box-shadow: insert 0 0 10px #777777; }
    </style>
  </head>
  <body>
    <h1>CSS3: Box Shadows</h1>
    <p class="one"></p>
    <p class="two"></p>
    <p class="three"></p>
    <br>
    <p class="four"></p>
    <p class="five"></p>
  </body>
  <footer>
    <br>
    <a href="index.html">Go Back</a>
  </footer>
</html>
