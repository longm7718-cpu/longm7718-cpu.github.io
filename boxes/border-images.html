<!DOCTYPE html>
<html>
  <head>
    <title>CSS3: Border Images</title>
    <style type="text/css">
      p {
	width: 197px;
	height: 54px;
	border: 11px solid #ffffff; }
      p.one {
	border-image: url("../_img/dots.gif") 11 11 11 11 stretch; }
      p.two {
	border-image: url("../_img/dots.gif") 11 11 11 11 round; } 
    </style>
  </head>
  <body>
    <h1>Border Images</h1>
    <p class="one"></p>
    <p class="two"></p>
  </body>

</html>
